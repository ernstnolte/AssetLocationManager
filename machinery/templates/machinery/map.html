<!DOCTYPE html>
<html>
<head>
    <title>Forestry Fleet Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Modern Reset and App Layout */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            height: 100vh; 
            background: #1e1e1e;
            color: #fff;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background: #252526;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3c3c3c;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            background: #117744; /* Forestry Green */
            color: white;
        }

        .sidebar-header h2 { margin: 0; font-size: 1.4rem; }
        .sidebar-header p { margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.8; }

        .sidebar.collapsed {
            width: 0;
        }

        .machine-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .machine-item {
            padding: 15px 20px;
            border-bottom: 1px solid #3c3c3c;
            cursor: pointer;
            transition: background 0.2s;
        }

        .machine-item:hover {
            background: #2a2d2e;
        }

        .machine-name { font-weight: bold; font-size: 1rem; color: #4ec9b0; }
        .machine-sn { font-size: 0.8rem; color: #858585; margin-top: 3px; }

        #map-container {
            flex-grow: 1;
            position: relative;
        }

        #map { 
            height: 100%; 
            width: 100%; 
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Active Fleet</h2>
            <p>SA Forestry Operations</p>
        </div>
        <ul class="machine-list">
            {% for machine in machines %}
                <li class="machine-item" onclick="focusMachine({{ machine.id }}, {{ machine.latest_latitude|default:'null' }}, {{ machine.latest_longitude|default:'null' }})">
                    <div class="machine-name">🌲 {{ machine.name }}</div>
                    <div class="machine-sn">S/N: {{ machine.serial_number }}</div>
                </li>
            {% empty %}
                <li class="machine-item" style="color: #858585;">No machines registered.</li>
            {% endfor %}
        </ul>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-25.0, 31.0], 9);

        // 1. Base Satellite Imagery Layer
        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);
        

        // 2. Transparent Roads & Labels Overlay (Creates the Hybrid Effect)
        var labelsLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Labels &copy; Esri',
            pane: 'markerPane' // This ensures labels draw beautifully ON TOP of everything else
        }).addTo(map);

        // Create an object to store our marker instances so we can trigger them later
        var machineMarkers = {};

        // Loop through and place the singular latest pin for each active machine
        {% for m in active_locations %}
            var marker = L.marker([{{ m.latest_latitude }}, {{ m.latest_longitude }}])
                .addTo(map)
                .bindPopup(`
                    <div style="color: #333; min-width: 150px;">
                        <a href="{% url 'machine_detail' m.id %}" style="text-decoration: none;">
                            <strong style="font-size: 1.1rem; color: #117744; cursor: pointer;">{{ m.name }}</strong>
                        </a>
                        <br>
                        <strong>S/N:</strong> {{ m.serial_number }}<br>
                        <hr style="border: 0; border-top: 1px solid #ddd; margin: 6px 0;">
                        <span style="font-size: 0.85rem; color: #666;">
                            <strong>Last Ping:</strong> {{ m.latest_timestamp|date:"d M Y H:i" }}
                        </span>
                    </div>
                `);

            // Store the marker using the machine's primary key ID
            machineMarkers[{{ m.id }}] = marker;
        {% endfor %}

        // This function handles the cinematic fly-to effect and triggers the popup window
        function focusMachine(machineId, lat, lng) {
            if (lat && lng) {
                // 1. Smoothly glide the camera down into the forest compartment (Zoom level 14)
                map.flyTo([lat, lng], 13, {
                    animate: true,
                    duration: 0.9
                });

                // 2. Once the map finishes moving, automatically open the marker's popup details
                map.once('moveend', function() {
                    if (machineMarkers[machineId]) {
                        machineMarkers[machineId].openPopup();
                    }
                });
            } else {
                alert("This machine hasn't transmitted any GPS coordinates yet.");
            }
        }
    </script>
</body>
</html>
