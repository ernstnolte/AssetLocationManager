{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Machine</title>
    <link rel="stylesheet" href="{% static 'machinery/css/style.css' %}">
</head>
<body>
    <div class="container">
        <a href="{% url 'machines' %}" class="btn btn-back">&larr; Back to Machine List</a>
        
        <div class="header">
            <div class="header-main">
                <h1>+ Add Machine</h1>
                <p class="meta">Register a new fleet asset into the database</p>
            </div>
        </div>

        <div class="frame form-card">
            <div class="form-row">
                <label for="name" class="form-label">Asset Name:</label>
                <input type="text" id="name" name="name" value="" class="input-field" placeholder="e.g. CAT 545D Skidder">
            </div>
            <div class="form-row">
                <label for="serial_number" class="form-label">Serial Number (S/N):</label>
                <input type="text" id="serial_number" name="serial_number" value="" class="input-field" placeholder="e.g. SN-90482-X">
            </div>
            <div class="option-row">
                <button type="button" class="btn btn-submit" onclick="saveMachine()">Save Asset</button>
            </div>
        </div>
    </div>

    <script>
        function saveMachine() {
            const name = document.getElementById('name').value;
            const serialNumber = document.getElementById('serial_number').value;

            if (!name || !serialNumber) {
                alert("Please fill in both the Asset Name and Serial Number.");
                return;
            }

            fetch("{% url 'machine_add'%}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({
                    'name': name,
                    'serial_number': serialNumber
                })
            }).then(response => {
                if (response.ok) {
                    window.location.href = "{% url 'machines' %}";
                } else {
                    alert('Failed to save machine details.');
                }
            });
        }
    </script>
</body>
</html>
