<html>
<head>
    <title>{{ machine.name }} - Edit</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: #252526;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
            margin-bottom: 30px;
        }
        h1 { margin: 0; color: #4ec9b0; font-size: 2rem; }
        .meta { color: #858585; margin-top: 5px; font-size: 1rem; }

        .btn {
            display: inline-block;
            background: #117744;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-back {
            background: #117744;
            font-weight: bold;
        }
        .btn-back:hover { background: #148f52; }
        .btn-submit {
            display: inline-block;
            background: #117744;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            transition: background 0.2s;
            width: 95%;
        }
        .btn-submit:hover { background: #148f52; }
        .btn-delete {
            display: inline-block;
            background: #c72e2e;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-delete:hover { background: #e53939; }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
            margin-bottom: 5px;
        }
        .option-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            max-width: 100%;
            margin-bottom: 5px;
        }
        label { font-size: 0.9rem; color: #aaaaaa; }
        .input-field {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #505050;
            background: #373738;
            color: #7e7e7e;
            font-size: 1rem;
            font-color: #7a7a7a;
        }
        .input-field:focus {
            padding: 10px;
            border-radius: 4px;
            border: 2px solid #505050;
            background: #373738;
            color: #fff;
            font-size: 1rem;
            font-color: #fff;
            outline: none;
            border-color: #4ec9b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'machines' %}" class="btn btn-back">← Back to Machine List</a>
        
        <div class="header">
            <h1>✎ Add Machine</h1>

            <div class="control-left">
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" value="" class="input-field">
                </div>
                <div class="form-row">
                    <label for="serial_number">S/N:</label>
                    <input type="text" id="serial_number" name="serial_number" value="" class="input-field">
                </div>
                <div class="option-row">
                    <button id="save-btn" type="button" class="btn btn-submit" onclick="saveMachine()">Save</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function saveMachine() {
            const name = document.getElementById('name').value;
            const serialNumber = document.getElementById('serial_number').value;

            fetch("{% url 'machine_add'%}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({
                    'name': name,
                    'serial_number': serialNumber
                })
            }).then(response => {
                if (response.ok) {
                    window.location.href = "{% url 'machines' %}";
                } else {
                    alert('Failed to save machine details.');
                }
            });
        }
    </script>

</body>
</html>
