{% load static %}
<html>
<head>
    <title>Add New Machine</title>
    <link rel="stylesheet" href="{% static 'machinery/css/style.css' %}">
</head>
<body>
    <div class="container">
        <a href="{% url 'machines' %}" class="btn btn-back">← Back to Machine List</a>
        
        <div class="header">
            <h1>+ Add Machine</h1>

            <div class="control-left">
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" value="" class="input-field">
                </div>
                <div class="form-row">
                    <label for="serial_number">S/N:</label>
                    <input type="text" id="serial_number" name="serial_number" value="" class="input-field">
                </div>
                <div class="option-row">
                    <a id="save-btn" type="button" class="btn btn-submit" onclick="saveMachine()">Save</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function saveMachine() {
            const name = document.getElementById('name').value;
            const serialNumber = document.getElementById('serial_number').value;

            fetch("{% url 'machine_add'%}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({
                    'name': name,
                    'serial_number': serialNumber
                })
            }).then(response => {
                if (response.ok) {
                    window.location.href = "{% url 'machines' %}";
                } else {
                    alert('Failed to save machine details.');
                }
            });
        }
    </script>

</body>
</html>
