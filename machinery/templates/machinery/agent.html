{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Telemetry Console</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{% static 'machinery/css/style.css' %}">
</head>
<body>
    <div class="container">
        <a href="{% url 'home' %}" class="btn btn-back">&larr; Home</a>
        
        <div class="header">
            <div class="header-main">
                <h1>🕵️‍♂️ Agent Telemetry</h1>
                <p class="meta">Asset deployment real-time position compiler</p>
            </div>
            <div id="timer-display" class="timer-badge">DURATION: 00:00:00</div>
        </div>

        <div class="frame control-panel">
            <div class="control-grid">
                <div class="control-left">
                    <div class="form-row">
                        <select id="machine-select" class="machine-picker input-field">
                            <option value="" disabled selected>Select a machine...</option>
                            {% for m in machines %}
                                <option value="{{ m.id }}">{{ m.name }} ({{ m.serial_number }})</option>
                            {% empty %}
                                <option value="" disabled>No registered machines found</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-row">
                        <button id="transmission-btn" class="btn btn-submit" onclick="toggleTransmission()">Start Transmission</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="map-container" class="map-wrapper">
            <div id="map"></div>
        </div>
        
        <div class="status-footer">
            <div id="demo" class="status-text">Transmission status: Offline</div>
            <div id="sync-status" class="timestamp">0 pings pending</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-28.5, 28.0], 6);
        var currentMarker = null;
        var watchId = null; 
        var timerId = null;
        var totalSeconds = 0;

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri'
        }).addTo(map);

        map.createPane('labelsPane');
        map.getPane('labelsPane').style.zIndex = 650;

        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labelsPane'
        }).addTo(map);

        const displayArea = document.getElementById("demo");
        const syncStatusDisplay = document.getElementById("sync-status");
        const machineSelector = document.getElementById("machine-select");
        const actionBtn = document.getElementById("transmission-btn");
        const timerDisplay = document.getElementById("timer-display");

        function updateStatusUI() {
            const currentQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            syncStatusDisplay.innerHTML = `${currentQueue.length} pings pending sync`;
        }

        updateStatusUI();

        function toggleTransmission() {
            if (watchId === null) {
                if (!machineSelector.value) {
                    alert("Please select an active machine before transmitting telemetry.");
                    return;
                }
                
                if (navigator.geolocation) {
                    machineSelector.disabled = true;
                    actionBtn.innerHTML = "Stop Transmission";
                    actionBtn.className = "btn btn-delete";
                    displayArea.innerHTML = "Opening hardware hook...";

                    watchId = navigator.geolocation.watchPosition(processIncomingPosition, error, {
                        enableHighAccuracy: true,
                        maximumAge: 0
                    });

                    totalSeconds = 0;
                    updateTimerUI(); 
                    timerId = setInterval(function() {
                        totalSeconds++;
                        updateTimerUI();
                    }, 1000);

                    is_transmitting = true;

                } else {
                    displayArea.innerHTML = "Geolocation unsupported.";
                }
            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                watchId = null;
                
                clearInterval(timerId);
                timerId = null;
                totalSeconds = 0;
                timerDisplay.innerHTML = "DURATION: 00:00:00";
                
                machineSelector.disabled = false;
                actionBtn.innerHTML = "Start Transmission";
                actionBtn.className = "btn btn-submit";
                displayArea.innerHTML = "Transmission status: Offline";

                is_transmitting = false;
            }
            fetch("/agent/set_transmit/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    machine_id: Number(machineSelector.value),
                    is_transmitting: is_transmitting
                })
            })
        }

        function updateTimerUI() {
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerHTML = `DURATION: ${hrs}:${mins}:${secs}`;
        }

        function processIncomingPosition(position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const selectedId = machineSelector.value;
            const selectedName = machineSelector.options[machineSelector.selectedIndex].text;
            
            displayArea.innerHTML = `📡 <strong>Transmitting</strong>: Lat ${currentLat.toFixed(5)}, Lng ${currentLng.toFixed(5)}`;

            map.flyTo([currentLat, currentLng], 16);
            
            setTimeout(function() {
                map.invalidateSize();
            }, 200);

            if (currentMarker) { map.removeLayer(currentMarker); }
            currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup(`Active: ${selectedName}`).openPopup();

            const newPing = {
                machine_id: parseInt(selectedId),
                latitude: currentLat,
                longitude: currentLng,
                timestamp: new Date().toISOString()
            };

            let savedQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            savedQueue.push(newPing);
            localStorage.setItem('offlinePings', JSON.stringify(savedQueue));
            
            updateStatusUI();
            syncDataWithServer();
        }

        function error(err) {
            console.warn(`GPS error (${err.code}): ${err.message}`);
            if (err.code === err.TIMEOUT) {
                displayArea.innerHTML = `GPS search timeout...`;
            } else {
                displayArea.innerHTML = `GPS connection dropped. Caching data locally.`;
            }
        }

        function syncDataWithServer() {
            const savedQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            if (savedQueue.length === 0) return;

            const itemToSync = savedQueue[0];

            fetch('/agent/save/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemToSync)
            })
            .then(res => {
                if (!res.ok) throw new Error("Sync failure.");
                return res.json();
            })
            .then(data => {
                let currentQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
                currentQueue.shift(); 
                localStorage.setItem('offlinePings', JSON.stringify(currentQueue));
                
                updateStatusUI();
                if (currentQueue.length > 0) {
                    syncDataWithServer();
                }
            })
            .catch(err => {
                console.log("Local system offline. Caching active sync pipeline.", err);
                updateStatusUI();
            });
        }

        setInterval(syncDataWithServer, 15000);
    </script>
</body>
</html>
