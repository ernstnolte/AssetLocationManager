<!DOCTYPE html>
<html lang="en">
<head>
    <title>Agent Location Recorder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Exact stylesheet matches from your reference */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: #252526;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
            margin-bottom: 20px;
        }
        h1 { margin: 0; color: #4ec9b0; font-size: 2rem; }
        .meta { color: #858585; margin-top: 5px; font-size: 1rem; }
        
        /* Modern Flexbox Row layout replacing table hacks */
        .control-grid {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Vertically aligns duration block with form elements */
            gap: 20px;
        }

        .control-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        
        /* Navigation / Control Weights */
        .btn-back {
            display: inline-block;
            background: #117744;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;

            box-sizing: border-box;
            text-align: center;
        }
        .btn-back:hover { background: #148f52; }
        
        /* Tracking Toggle Modifier Classes */
        .btn-stop-mode { background: #a61c1c; }
        .btn-stop-mode:hover { background: #c22323; }

        /* Form Controls */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label { font-size: 0.9rem; color: #aaaaaa; }
        .machine-picker {
            width: 100%;

            padding: 10px;
            background: #2d2d30;
            color: #fff;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        /* Duration Box perfectly centered inside its parent */
        #timer-display {
            background: #2d2d30;
            border: 1px solid #3c3c3c;
            color: #4ec9b0;
            padding: 9%;
            border-radius: 8px;
            font-weight: 600;
            font-family: monospace;
            font-size: 1.3rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }

        /* Map Embed Container Frame */
        #map-container { 
            position: relative; 
            width: 100%;
            height: 400px; 
            background: #252526;
            border-radius: 8px;
            overflow: hidden; 
            border: 1px solid #3c3c3c;
            margin-bottom: 20px;
        }
        #map { height: 100%; width: 100%; }
        
        /* Embedded Dark Theme Map Popup Adjustments */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #252526 !important;
            border: 1px solid #3c3c3c;
            color: #fff !important;
            border-radius: 4px;
        }

        /* Status Footer */
        .status-footer {
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        #demo { font-family: monospace; color: #ce9178; }
        #demo strong { color: #4ec9b0; }
        .timestamp { color: #aaaaaa; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <h1>🕵️‍♂️ Agent Telemetry</h1>
            <div class="meta">Asset deployment real-time position compiler</div>
        </div>

        <div class="header">
            <div class="control-grid">
                
                <div class="control-left">
                    <div class="form-row">
                        {% comment %} <label for="machine-select">Assign Target Machine:</label> {% endcomment %}
                        <select id="machine-select" class="machine-picker">
                            {% for m in machines %}
                                <option value="{{ m.id }}">{{ m.name }} ({{ m.serial_number }})</option>
                            {% empty %}
                                <option value="">No registered machines found</option>
                            {% endfor %}
                            <option value="" disabled selected>Select a machine...</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <button id="transmission-btn" class="btn-back" onclick="toggleTransmission()">Start Transmission</button>
                    </div>
                </div>
                
                <div class="control-right">
                    <div id="timer-display">DURATION: 00:00:00</div>
                </div>

            </div>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <div class="status-footer">
            <div id="demo">Transmission status: Offline</div>
            <div id="sync-status" class="timestamp">0 pings pending</div>
        </div>
        
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-28.5, 28.0], 6);
        var currentMarker = null;
        
        var watchId = null; 
        var fallbackIntervalId = null; 
        var lastPingTime = 0;
        const PING_INTERVAL = 60000;

        var timerId = null;
        var totalSeconds = 0;

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri'
        }).addTo(map);

        map.createPane('labelsPane');
        map.getPane('labelsPane').style.zIndex = 650;

        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labelsPane'
        }).addTo(map);

        const displayArea = document.getElementById("demo");
        const syncStatusDisplay = document.getElementById("sync-status");
        const machineSelector = document.getElementById("machine-select");
        const actionBtn = document.getElementById("transmission-btn");
        const timerDisplay = document.getElementById("timer-display");

        function updateStatusUI() {
            const currentQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            syncStatusDisplay.innerHTML = `${currentQueue.length} pings pending sync`;
        }

        updateStatusUI();

        function toggleTransmission() {
            if (watchId === null) {
                if (!machineSelector.value) {
                    alert("Please select an active machine before transmitting telemetry.");
                    return;
                }
                
                if (navigator.geolocation) {
                    machineSelector.disabled = true;
                    actionBtn.innerHTML = "Stop Transmission";
                    actionBtn.className = "btn-back btn-stop-mode";
                    displayArea.innerHTML = "Opening hardware hook...";

                    watchId = navigator.geolocation.watchPosition(processIncomingPosition, error, {
                        enableHighAccuracy: true,
                        maximumAge: 0
                    });

                    fallbackIntervalId = setInterval(function() {
                        const now = Date.now();
                        if (now - lastPingTime >= PING_INTERVAL) {
                            navigator.geolocation.getCurrentPosition(processIncomingPosition, error, {
                                enableHighAccuracy: true,
                                maximumAge: 0
                            });
                        }
                    }, 20000); 

                    totalSeconds = 0;
                    updateTimerUI(); 
                    timerId = setInterval(function() {
                        totalSeconds++;
                        updateTimerUI();
                    }, 1000);

                } else {
                    displayArea.innerHTML = "Geolocation unsupported.";
                }
            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                if (fallbackIntervalId) clearInterval(fallbackIntervalId);
                watchId = null;
                fallbackIntervalId = null;
                lastPingTime = 0;
                
                clearInterval(timerId);
                timerId = null;
                totalSeconds = 0;
                timerDisplay.innerHTML = "DURATION: 00:00:00";
                
                machineSelector.disabled = false;
                actionBtn.innerHTML = "Start Transmission";
                actionBtn.className = "btn-back";
                displayArea.innerHTML = "Transmission status: Offline";
            }
        }

        function updateTimerUI() {
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerHTML = `DURATION: ${hrs}:${mins}:${secs}`;
        }

        function processIncomingPosition(position) {
            const currentTime = Date.now();
            
            if (currentTime - lastPingTime < PING_INTERVAL) {
                return; 
            }
            
            lastPingTime = currentTime; 
            
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const selectedId = machineSelector.value;
            const selectedName = machineSelector.options[machineSelector.selectedIndex].text;
            
            displayArea.innerHTML = `📡 <strong>Transmitting</strong>: Lat ${currentLat.toFixed(5)}, Lng ${currentLng.toFixed(5)}`;

            map.flyTo([currentLat, currentLng], 16);
            
            setTimeout(function() {
                map.invalidateSize();
            }, 200);

            if (currentMarker) { map.removeLayer(currentMarker); }
            currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup(`Active: ${selectedName}`).openPopup();

            const newPing = {
                machine_id: parseInt(selectedId),
                latitude: currentLat,
                longitude: currentLng,
                timestamp: new Date().toISOString()
            };

            let savedQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            savedQueue.push(newPing);
            localStorage.setItem('offlinePings', JSON.stringify(savedQueue));
            
            updateStatusUI();
            syncDataWithServer();
        }

        function error(err) {
            console.warn(`GPS error (${err.code}): ${err.message}`);
            if (err.code === err.TIMEOUT) {
                displayArea.innerHTML = `GPS search timeout...`;
            } else {
                displayArea.innerHTML = `GPS connection dropped. Caching data locally.`;
            }
        }

        function syncDataWithServer() {
            const savedQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
            if (savedQueue.length === 0) return;

            const itemToSync = savedQueue[0];

            fetch('/agent/save/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemToSync)
            })
            .then(res => {
                if (!res.ok) throw new Error("Sync failure.");
                return res.json();
            })
            .then(data => {
                let currentQueue = JSON.parse(localStorage.getItem('offlinePings') || '[]');
                currentQueue.shift(); 
                localStorage.setItem('offlinePings', JSON.stringify(currentQueue));
                
                updateStatusUI();
                if (currentQueue.length > 0) {
                    syncDataWithServer();
                }
            })
            .catch(err => {
                console.log("Local system offline. Caching active sync pipeline.", err);
                updateStatusUI();
            });
        }

        setInterval(syncDataWithServer, 15000);
    </script>
</body>
</html>
