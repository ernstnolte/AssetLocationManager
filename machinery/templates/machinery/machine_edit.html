{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ machine.name }} - Edit</title>
    <link rel="stylesheet" href="{% static 'machinery/css/style.css' %}">
</head>
<body>
    <div class="container">
        <a href="{% url 'machine_detail' machine.id %}" class="btn btn-back">&larr; Back to Machine Details</a>
        
        <div class="header">
            <div class="header-main">
                <h1>✎ Edit Machine</h1>
                <p class="meta">Update system identifiers or remove asset record</p>
            </div>
        </div>

        <div class="frame form-card">
            <div class="form-row">
                <label for="name" class="form-label">Asset Name:</label>
                <input type="text" id="name" name="name" value="{{ machine.name }}" class="input-field">
            </div>
            <div class="form-row">
                <label for="serial_number" class="form-label">Serial Number (S/N):</label>
                <input type="text" id="serial_number" name="serial_number" value="{{ machine.serial_number }}" class="input-field">
            </div>
            <div class="option-row">
                <button type="button" class="btn btn-submit" onclick="saveMachine()">📁 Save Changes</button>
                <button type="button" class="btn btn-delete" onclick="deleteMachine()">🗑️ Delete Asset</button>
            </div>
        </div>
    </div>

    <script>
        function saveMachine() {
            const name = document.getElementById('name').value;
            const serialNumber = document.getElementById('serial_number').value;

            fetch("{% url 'machine_edit' machine.id %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({
                    'name': name,
                    'serial_number': serialNumber
                })
            }).then(response => {
                if (response.ok) {
                    window.location.href = "{% url 'machine_detail' machine.id %}";
                } else {
                    alert('Failed to save machine details.');
                }
            });
        }

        function deleteMachine() {
            if (confirm('Confirm deletion. This action cannot be undone.')) {
                fetch("{% url 'machine_delete' machine.id %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = "{% url 'machines' %}";
                    } else {
                        alert('Failed to delete machine.');
                    }
                });
            }
        }
    </script>
</body>
</html>
